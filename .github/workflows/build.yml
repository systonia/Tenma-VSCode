# Builds the .vsix on every pushed branch, and on a tag v* a release with it.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # On a tag, the tag is the version, whatever package.json says
      - run: |
          case "$GITHUB_REF" in
            refs/tags/v*) npx -y @vscode/vsce@4 package "${GITHUB_REF_NAME#v}" --no-git-tag-version --no-update-package-json ;;
            *) npx -y @vscode/vsce@4 package ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: tenma-*.vsix
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes tenma-*.vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
